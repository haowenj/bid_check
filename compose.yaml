name: bid-check

services:
  app:
    image: bid-check:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      LLM_BASE_URL: "${LLM_BASE_URL}"
      LLM_API_KEY: "${LLM_API_KEY}"
      LLM_MODEL: "${LLM_MODEL}"
      LLM_ENABLE_THINKING: "${LLM_ENABLE_THINKING:-false}"
      LLM_MAX_TOKENS: "${LLM_MAX_TOKENS:-8192}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-90}"
      LLM_MAX_CONCURRENCY: "${LLM_MAX_CONCURRENCY:-5}"
      APP_DATA_DIR: /app/data
      APP_DATABASE_PATH: /app/data/bid_check.db
      APP_TASKS_DIR: /app/data/tasks
      MINERU_URL: "${MINERU_URL:-http://host.docker.internal:7100}"
      MINERU_BACKEND: "${MINERU_BACKEND:-hybrid-engine}"
      MINERU_SERVER_URL: "${MINERU_SERVER_URL:-}"
      MINERU_API_KEY: "${MINERU_API_KEY:-}"
      MINERU_TIMEOUT_SECONDS: "${MINERU_TIMEOUT_SECONDS:-1800}"
      MINERU_POLL_INTERVAL_SECONDS: "${MINERU_POLL_INTERVAL_SECONDS:-2}"
      COMPLIANCE_MAX_BATCHES: "${COMPLIANCE_MAX_BATCHES:-8}"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
