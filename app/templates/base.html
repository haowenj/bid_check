<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}标书检查{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='bid-check.css') }}">
</head>
<body {% block body_attributes %}{% endblock %}>
  <header class="topbar">
    <a class="brand" href="/bid-check" aria-label="返回标书检查首页">
      <span class="brand-mark" aria-hidden="true">标</span>
      <strong>标书检查</strong>
    </a>
    <span class="topbar-note">投标文件合规工作台</span>
  </header>

  <main class="shell">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
